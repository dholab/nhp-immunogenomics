name: Scheduled Update

on:
  schedule:
    # Every day at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # Required to dispatch the Deploy Pages workflow after merging.
  actions: write

concurrency:
  group: scheduled-update
  cancel-in-progress: false

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Save current version info
        id: before
        run: |
          if [ -f version.json ]; then
            mhc_ver=$(python3 -c "import json; d=json.load(open('version.json')); print(d.get('MHC', {}).get('version', 'unknown'))")
            nhkir_ver=$(python3 -c "import json; d=json.load(open('version.json')); print(d.get('NHKIR', {}).get('version', 'unknown'))")
            echo "mhc_version=$mhc_ver" >> "$GITHUB_OUTPUT"
            echo "nhkir_version=$nhkir_ver" >> "$GITHUB_OUTPUT"
          else
            echo "mhc_version=none" >> "$GITHUB_OUTPUT"
            echo "nhkir_version=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Run incremental update
        run: uv run nhp-pipeline update

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Read updated version info
        if: steps.changes.outputs.has_changes == 'true'
        id: after
        run: |
          mhc_ver=$(python3 -c "import json; d=json.load(open('version.json')); print(d.get('MHC', {}).get('version', 'unknown'))")
          nhkir_ver=$(python3 -c "import json; d=json.load(open('version.json')); print(d.get('NHKIR', {}).get('version', 'unknown'))")
          mhc_count=$(python3 -c "import json; d=json.load(open('version.json')); print(d.get('MHC', {}).get('allele_count', 0))")
          nhkir_count=$(python3 -c "import json; d=json.load(open('version.json')); print(d.get('NHKIR', {}).get('allele_count', 0))")
          echo "mhc_version=$mhc_ver" >> "$GITHUB_OUTPUT"
          echo "nhkir_version=$nhkir_ver" >> "$GITHUB_OUTPUT"
          echo "mhc_count=$mhc_count" >> "$GITHUB_OUTPUT"
          echo "nhkir_count=$nhkir_count" >> "$GITHUB_OUTPUT"

      - name: Summarize changed files
        if: steps.changes.outputs.has_changes == 'true'
        id: summary
        run: |
          gb_changed=$(git diff --name-only -- 'data/**/*.gb' | wc -l | tr -d ' ')
          gb_new=$(git ls-files --others --exclude-standard -- 'data/**/*.gb' | wc -l | tr -d ' ')
          echo "gb_changed=$gb_changed" >> "$GITHUB_OUTPUT"
          echo "gb_new=$gb_new" >> "$GITHUB_OUTPUT"

          # Check for provisional allele retirements
          retired_file="provisional/retired/retired.tsv"
          if git diff --name-only -- "$retired_file" | grep -q .; then
            retired_lines=$(git diff -- "$retired_file" | grep '^+[^+]' | grep -v 'provisional_name' || true)
            if [ -n "$retired_lines" ]; then
              retired_summary=$(echo "$retired_lines" | sed 's/^+//' | awk -F'\t' '{printf "- %s → %s (%s)\\n", $1, $2, $3}')
              echo "has_retirements=true" >> "$GITHUB_OUTPUT"
              # Escape for multiline output
              {
                echo 'retired_summary<<RETIRED_EOF'
                echo "$retired_summary"
                echo 'RETIRED_EOF'
              } >> "$GITHUB_OUTPUT"
            else
              echo "has_retirements=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "has_retirements=false" >> "$GITHUB_OUTPUT"
          fi

      # Gate the auto-merge below. Checks cannot run as PR checks: workflows on a
      # pull request authored by GITHUB_TOKEN stay in "action_required" forever,
      # so they are run here instead, before the PR is created.
      - name: Run test suite
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          uv run pytest -q
          uv run nhp-pipeline --help

      - name: Validate provisional alleles
        if: steps.changes.outputs.has_changes == 'true'
        run: uv run nhp-pipeline provisional-validate

      - name: Create pull request
        if: steps.changes.outputs.has_changes == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "Update allele data (MHC ${{ steps.after.outputs.mhc_version }}, NHKIR ${{ steps.after.outputs.nhkir_version }})"
          title: "Update allele data (MHC ${{ steps.after.outputs.mhc_version }}, NHKIR ${{ steps.after.outputs.nhkir_version }})"
          body: |
            Automated incremental update detected changes in IPD allele data.

            | Database | Previous | Updated | Alleles |
            |----------|----------|---------|---------|
            | IPD-MHC  | ${{ steps.before.outputs.mhc_version }} | ${{ steps.after.outputs.mhc_version }} | ${{ steps.after.outputs.mhc_count }} |
            | IPD-NHKIR | ${{ steps.before.outputs.nhkir_version }} | ${{ steps.after.outputs.nhkir_version }} | ${{ steps.after.outputs.nhkir_count }} |

            **Changed files**: ${{ steps.summary.outputs.gb_changed }} modified, ${{ steps.summary.outputs.gb_new }} new GenBank files.

            ${{ steps.summary.outputs.has_retirements == 'true' && format('**Provisional allele retirements**:\n{0}', steps.summary.outputs.retired_summary) || '' }}

            Only locus files containing new or modified alleles were regenerated.
            Version suffixes (e.g., 3.16.0.0.1) indicate silent IPD updates without an official release.
            Please review the changes and merge if the data looks correct.
          branch: auto-update/ipd-release
          delete-branch: true

      # The PR exists as an audit record; the test gate above has already passed,
      # so merge it rather than leaving it for manual review.
      - name: Merge pull request
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          # GitHub needs a moment to compute mergeability on a freshly pushed branch.
          for attempt in 1 2 3 4 5 6; do
            state=$(gh pr view "$PR" --json mergeable --jq .mergeable)
            if [ "$state" = "MERGEABLE" ]; then
              gh pr merge "$PR" --squash --delete-branch
              exit 0
            fi
            echo "PR #$PR mergeable=$state (attempt $attempt), waiting..."
            sleep 10
          done
          echo "::error::PR #$PR never became mergeable; leaving it open for review."
          exit 1

      # A merge performed with GITHUB_TOKEN does not trigger push-based workflows,
      # so Deploy Pages must be dispatched explicitly. workflow_dispatch is the
      # documented exception to that restriction.
      - name: Deploy site
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-pages.yml --ref main
